name: Folio
options:
  bundleIdPrefix: com.sungwoonpk
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NoteCore:
    path: Packages/NoteCore
targets:
  Folio:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: NoteCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sungwoonpk.folio
        PRODUCT_NAME: Folio
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Folio
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  FolioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: Folio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sungwoonpk.folio.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: Folio
schemes:
  Folio:
    build:
      targets:
        Folio: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FolioUITests
